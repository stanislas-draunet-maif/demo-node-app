name: Trigger auto deployment for demo-build-local

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ sansdocker ]
    paths:
    - '**'
    - '.github/workflows/demo-build-local-AutoDeployTrigger-340920c8-b375-481c-a1b6-804e6fa0896f.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.DEMOBUILDLOCAL_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.DEMOBUILDLOCAL_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.DEMOBUILDLOCAL_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.DEMOBUILDLOCAL_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.DEMOBUILDLOCAL_REGISTRY_PASSWORD }}
          containerAppName: demo-build-local
          resourceGroup: rg-glaude-xp-maifinno
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


