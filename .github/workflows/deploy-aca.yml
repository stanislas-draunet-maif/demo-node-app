name: Deploy to GLAUDE

on:
  workflow_run:
    workflows:
      - Build and Publish Docker Image
    types:
      - completed
  workflow_dispatch:
    inputs:
      target:
        description: Environnement cible
        required: true
        type: choice
        options:
          - recette
          - production
        default: recette
      image_tag:
        description: Tag de l'image GHCR à déployer
        required: true
        default: latest
        type: string

permissions:
  contents: read
  packages: read
  id-token: write

env:
  REGISTRY_URL: ghcr.io
  IMAGE_REPOSITORY: ${{ github.repository }}
  ACA_RESSOURCE_GROUP: rg-glaude-xp-maifinno
  ACA_CONTAINERAPPS_ENV: aca-glaude-xp-maifinno
  APP_NAME: demo-app
  DOMAINE_NAME: xp.maifinno.fr
  POSTGRES_SERVER: pg-glaude-sdx
  POSTGRES_RESOURCE_GROUP: rg-glaude-database-sdx

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'recette' }}

    steps:
      - name: Resolve deployment settings
        id: settings
        shell: bash
        run: |
          set -euo pipefail

          default_commit_tag="sha-$(printf '%.7s' '${{ github.sha }}')"
          workflow_run_commit_tag="sha-$(printf '%.7s' '${{ github.event.workflow_run.head_sha }}')"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            target="${{ inputs.target }}"
            image_tag="${{ inputs.image_tag }}"

            if [[ "$image_tag" == "latest" ]]; then
              image_tag="$default_commit_tag"
            fi
          else
            target="recette"
            image_tag="$workflow_run_commit_tag"
          fi

          case "$target" in
            recette)
              container_app_name="${{ env.APP_NAME }}-re7"
              ;;
            production)
              container_app_name="${{ env.APP_NAME }}"
              ;;
            *)
              echo "Cible inconnue: $target" >&2
              exit 1
              ;;
          esac

          for value in "$container_app_name"; do
            if [[ -z "$value" ]]; then
              echo "Variables GitHub manquantes pour la cible $target" >&2
              exit 1
            fi
          done

          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "container_app_name=$container_app_name" >> "$GITHUB_OUTPUT"
          echo "image_to_deploy=${REGISTRY_URL}/${IMAGE_REPOSITORY}:$image_tag" >> "$GITHUB_OUTPUT"

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.GLAUDE_CLUSTER_UAI_LOGIN_CLIENT_ID }}
          tenant-id: ${{ secrets.GLAUDE_CLUSTER_UAI_LOGIN_TENANT_ID }}
          subscription-id: ${{ secrets.GLAUDE_CLUSTER_UAI_LOGIN_SUBSCRIPTION_ID }}

      # Tester si le containers app existe deja et s'il a une identité managé system assignée
      - name: Check if Azure Container App exists and has system-assigned managed identity
        id: check_container_app
        run: |
          set -euo pipefail

          container_app_name="${{ steps.settings.outputs.container_app_name }}"
          resource_group="${{ env.ACA_RESSOURCE_GROUP }}"

          app_exists=$(az containerapp show --name "$container_app_name" --resource-group "$resource_group" --query "name" -o tsv || echo "")
          if [[ -z "$app_exists" ]]; then
            echo "Container App $container_app_name does not exist."
            echo "has_system_identity=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          identity=$(az containerapp show --name "$container_app_name" --resource-group "$resource_group" --query "identity.type" -o tsv)
          if [[ "$identity" != *"SystemAssigned"* ]]; then
            echo "Container App $container_app_name does not have a system-assigned managed identity."
            echo "has_system_identity=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Container App $container_app_name exists and has a system-assigned managed identity."
          echo "has_system_identity=true" >> "$GITHUB_OUTPUT"

      # Si le container app n'existe pas ou n'a pas d'identité managée system assignée cela veut dire que c'est le premier deploiement
      # On deploye quand meme comme si c'était un déploiement classique avec Deploy image to Azure Container Apps, mais on active l'identité managée system assignée apres le deploiement
      - name: Deploy image to Azure Container Apps (first deployment)
        if: steps.check_container_app.outputs.has_system_identity == 'false'
        uses: azure/container-apps-deploy-action@v2
        with:
          imageToDeploy: ${{ steps.settings.outputs.image_to_deploy }}
          registryUrl: ${{ env.REGISTRY_URL }}
          registryUsername: ${{ secrets.GHCR_USERNAME }}
          registryPassword: ${{ secrets.GHCR_TOKEN }}
          containerAppName: ${{ steps.settings.outputs.container_app_name }}
          resourceGroup: ${{ env.ACA_RESSOURCE_GROUP }}
          containerAppEnvironment: ${{ env.ACA_CONTAINERAPPS_ENV }}
          targetPort: 3000
          ingress: external
          disableTelemetry: true

      - name: Enable system-assigned managed identity
        if: steps.check_container_app.outputs.has_system_identity == 'false'
        run: |
          set -euo pipefail

          container_app_name="${{ steps.settings.outputs.container_app_name }}"
          resource_group="${{ env.ACA_RESSOURCE_GROUP }}"

          az containerapp identity assign --name "$container_app_name" --resource-group "$resource_group" --system-assigned

      - name: Checkout repository
        if: steps.check_container_app.outputs.has_system_identity == 'false'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: steps.check_container_app.outputs.has_system_identity == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        if: steps.check_container_app.outputs.has_system_identity == 'false'
        run: npm ci

      - name: Validate inputs and test provisioning
        if: steps.check_container_app.outputs.has_system_identity == 'false'
        env:
          CONTAINER_APP_NAME: ${{ steps.settings.outputs.container_app_name }}
        run: |
          node --input-type=module -e "import { validateSettings } from './scripts/provision-postgres.mjs'; validateSettings(process.env.CONTAINER_APP_NAME, process.env.POSTGRES_SERVER)"
          npm run test:provision

      - name: Provision database and system identity access
        if: steps.check_container_app.outputs.has_system_identity == 'false'
        env:
          CONTAINER_APP_NAME: ${{ steps.settings.outputs.container_app_name }}
          ACA_RESOURCE_GROUP: ${{ env.ACA_RESSOURCE_GROUP }}
          POSTGRES_RESOURCE_GROUP: ${{ env.POSTGRES_RESOURCE_GROUP }}
          POSTGRES_ENTRA_ADMIN_USERNAME: aca-glaude-xp-maifinnorg-glaude-xp-maifinnoOidc
        run: node scripts/provision-postgres.mjs

      # Alors on execute cette etape seulement si le container app existe et a une identité managée system assignée
      - name: Deploy image to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          imageToDeploy: ${{ steps.settings.outputs.image_to_deploy }}
          registryUrl: ${{ env.REGISTRY_URL }}
          registryUsername: ${{ secrets.GHCR_USERNAME }}
          registryPassword: ${{ secrets.GHCR_TOKEN }}
          containerAppName: ${{ steps.settings.outputs.container_app_name }}
          resourceGroup: ${{ env.ACA_RESSOURCE_GROUP }}
          containerAppEnvironment: ${{ env.ACA_CONTAINERAPPS_ENV }}
          targetPort: 3000
          ingress: external
          disableTelemetry: true
          environmentVariables: >-
            DATABASE_AUTH=azure-managed-identity
            PGHOST=${{ env.POSTGRES_SERVER }}.postgres.database.azure.com
            PGPORT=5432
            PGDATABASE=${{ steps.settings.outputs.container_app_name }}
            PGUSER=${{ steps.settings.outputs.container_app_name }}
